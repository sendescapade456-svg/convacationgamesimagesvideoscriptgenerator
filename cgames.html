<body>
<header class="top">
  <div class="brand">
    <div class="mark">CG</div>
    <div>
      <h1><b>CONVACATION</b> — CGAMES</h1>
      <p>Image · Video · Script generator for conversation games</p>
    </div>
    <span class="brand-badge">OFFLINE</span>
  </div>
  <div class="top-actions">
    <button class="btn ghost" id="btnRandom">Shuffle</button>
    <button class="btn" id="btnExport">Export JSON</button>
    <button class="btn small" id="btnClear">Clear history</button>
  </div>
</header>

<div class="wrap">
  <aside class="panel" aria-label="Controls">
    <div class="panel-head"><h2>Build your game</h2><span style="font-size:11px;color:var(--muted)">v1 · local</span></div>
    <div class="panel-body">
      <div class="field">
        <label>Game family</label>
        <select class="select" id="family">
          <option value="word">Word & Memory</option>
          <option value="draw">Draw & Guess</option>
          <option value="act">Act & Charades</option>
          <option value="story">Story Weave</option>
          <option value="debate">Debate & Vote</option>
          <option value="move">Move & React</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label>Players</label>
          <div class="range"><input type="range" id="players" min="2" max="20" value="5"><b id="playersVal">5</b></div>
        </div>
        <div class="field">
          <label>Minutes</label>
          <select class="select" id="minutes">
            <option value="5">5 — icebreaker</option>
            <option value="10" selected>10 — quick</option>
            <option value="20">20 — session</option>
            <option value="40">40 — workshop</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Group vibe</label>
        <div class="segment" id="vibe">
          <button data-v="cozy" class="active">Cozy</button>
          <button data-v="competitive">Competitive</button>
          <button data-v="silly">Silly</button>
        </div>
      </div>
      <div class="field">
        <label>Energy <span>— calm → chaos</span></label>
        <div class="range"><input type="range" id="energy" min="1" max="5" value="3"><b id="energyVal">3 · balanced</b></div>
      </div>
      <div class="field">
        <label>Keywords <span>— pick 1–3</span></label>
        <input class="input" id="customKw" placeholder="Add a word and press Enter — e.g. beach, nostalgia">
        <div class="keywords" id="kwList"></div>
      </div>
      <div class="field">
        <label>Age mix</label>
        <select class="select" id="age">
          <option value="kids">Kids (8–12)</option>
          <option value="teens">Teens</option>
          <option value="mixed" selected>Mixed / Adults</option>
          <option value="seniors">Seniors friendly</option>
        </select>
      </div>
      <button class="gen" id="generate">Generate → <span style="opacity:.85;font-weight:600">Script + Images + Video</span></button>
      <p class="hint">No API needed. Everything is generated locally from templates. Use <b>Shuffle</b> for a surprise, then copy prompts into your image/video tool.</p>
      <div class="history" id="history" style="margin-top:14px"></div>
    </div>
  </aside>

  <main class="panel" aria-label="Output">
    <div class="out-head">
      <div class="tabs" role="tablist">
        <button class="active" data-tab="script">Script</button>
        <button data-tab="images">Images</button>
        <button data-tab="video">Video</button>
        <button data-tab="print">Print</button>
      </div>
      <div class="out-actions">
        <button class="btn small" id="copyAll">Copy current</button>
        <button class="btn small primary" id="copyPrompts">Copy all prompts</button>
      </div>
    </div>
    <div class="out-body" id="out"></div>
  </main>
</div>

<script>
const KEYWORDS = ["travel","beach","food","music","nostalgia","city","nature","mystery","future","retro","island","laughter","campfire","cards","dice","teamwork"];
const FAMILIES = {
  word:{title:["Word Swap","Echo Chamber","Last Word Wins"], setup:"No materials. Circle.", twist:"Ban the most common word."},
  draw:{title:["Sketch Relay","Blind Canvas","Doodle Telephone"], setup:"Paper + markers. One shared table.", twist:"Draw with non-dominant hand."},
  act:{title:["Freeze Frame","Soundtrack Life","Human Library"], setup:"Open floor. Phones down.", twist:"Act without speaking for 20s."},
  story:{title:["Thread & Drift","Yes, And…","Postcard Chain"], setup:"One starter card per player.", twist:"Each addition must include a keyword."},
  debate:{title:["Minority Rules","Hot Take Court","Balance Beam"], setup:"Two sides, one judge rotates.", twist:"You must argue the opposite side."},
  move:{title:["Pulse Check","Mirror Bloom","Signal Chain"], setup:"Standing circle, 2m apart.", twist:"Add a sound to every move."}
};
const VIBES = {
  cozy:{adj:["warm","gentle","glow-lit"], ruleTone:"kind, unhurried"},
  competitive:{adj:["sharp","electric","score-lit"], ruleTone:"snappy, stakes-forward"},
  silly:{adj:["wobbly","bright","laugh-cracked"], ruleTone:"playful, looser"}
};
const AGES = {kids:"simple words, big gestures", teens:"fast, meme-aware, self-aware", mixed:"witty, inclusive", seniors:"clear, seated-friendly, larger text"};

let state = {
  family:"word", players:5, minutes:"10", vibe:"cozy", energy:3, age:"mixed", kws:new Set(["travel","laughter"]),
  tab:"script", history: JSON.parse(localStorage.getItem("cg_history")||"[]"),
  current:null, hash:0
};

const el = id=>document.getElementById(id);
const kwList = el("kwList");

function renderKeywords(){
  kwList.innerHTML="";
  KEYWORDS.forEach(k=>{
    const b=document.createElement("button");
    b.className="kw"+(state.kws.has(k)?" active":"");
    b.textContent=k;
    b.onclick=()=>{ if(state.kws.has(k)) state.kws.delete(k); else { if(state.kws.size>=3) { const first=[...state.kws][0]; state.kws.delete(first);} state.kws.add(k);} renderKeywords(); };
    kwList.appendChild(b);
  });
}
renderKeywords();

function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function seeded(h){ return ()=> (h = Math.imul(h, 1664525)+1013904223 >>>0)/4294967296; }

function buildGame(){
  const key = `${state.family}|${state.players}|${state.minutes}|${state.vibe}|${state.energy}|${state.age}|${[...state.kws].sort().join(",")}|${Date.now()}`;
  const h = hash(key + Math.random().toString().slice(2));
  const rnd = seeded(h);
  const fam = FAMILIES[state.family];
  const vibe = VIBES[state.vibe];
  const picks = [...state.kws];
  const titleBase = fam.title[Math.floor(rnd()*fam.title.length)];
  const adj = vibe.adj[Math.floor(rnd()*vibe.adj.length)];
  const title = `${titleBase}: ${adj} ${picks[0]||"mix"} edition`;
  const rounds = state.minutes==="5"?2: state.minutes==="10"?3: state.minutes==="20"?4:6;
  const teamMode = state.players>8 ? "Teams of 3–4, rotate captain each round." : state.players>4 ? "Pairs, then full-circle share." : "Everyone plays individually.";
  const setupExtra = state.age==="kids" ? "Use picture cards, not text." : state.age==="seniors" ? "Chairs in a U-shape, speak slowly." : "";
  const energyNote = ["zen, 1 action at a time","steady, one talker","balanced, quick turns","high, overlap allowed","chaos, simultaneous"][state.energy-1];
  const rules = [
    `Host reads the starter: “A ${picks.join(" / ")||"mystery"} moment from last year.” First player responds in ≤ 12 words.`,
    `Next player must ${state.family==="word"?"reuse the last word": state.family==="draw"?"extend the drawing": state.family==="act"?"mirror the gesture": state.family==="story"?"add one sentence containing “"+(picks[1]||picks[0]||"suddenly")+"”": state.family==="debate"?"argue the flip side":"add a move + sound"} before passing.`,
    `Energy: ${energyNote}. If someone hesitates > 7s, group claps and they draw a twist card.`,
    fam.twist,
    `${teamMode} Score only if group laughs or nods — no judge.`
  ];
  const scoring = state.vibe==="competitive" ? "First to 7 keeps, or most tokens after "+rounds+" rounds wins." : "No winner — collect favorite lines for the closing postcard.";
  const variations = [
    {name:"Light", text:`Play ${rounds-1} rounds, no twist, perfect for ${AGES[state.age]}.`},
    {name:"Pro", text:`Add a timer (45s/turn) and ban “yes/no” for one round.`},
    {name:"Large group", text:`Split in two circles, winners teach the other circle in 2 minutes.`},
    {name:"Quiet", text:`Write instead of speak — pass papers clockwise.`}
  ];
  const imagePrompts = [
    {tag:"Poster", ar:"3:4", prompt:`Flat vector poster for a conversation game “${title}”, ${adj} palette, ${picks.join(", ")||"warm neutrals"}, bold serif title, minimal icons (speech bubble + ${state.family}), risograph texture, studio lighting --ar 3:4`},
    {tag:"Thumbnail", ar:"16:9", prompt:`Isometric tabletop scene, ${state.players} diverse friends playing ${titleBase.toLowerCase()} in a ${picks[0]||"cozy"} living room, soft shadows, clean 3D, ${vibe.adj[0]} mood --ar 16:9`},
    {tag:"Cards", ar:"1:1", prompt:`Set of 12 game cards fanned out, each with a single word: ${[...state.kws].join(", ")||"travel, laughter"}, linen texture, rounded corners, top-down, ${state.age} friendly typography --ar 1:1`},
    {tag:"Scene", ar:"21:9", prompt:`Cinematic wide shot, people laughing mid-game, ${picks.slice(0,2).join(" and ")||"warm light"}, film grain, shallow depth, authentic, not staged --ar 21:9`}
  ];
  const scenes = [
    {t:"0:00–0:04", ho:"Hook", vo:`“What if your next ${picks[0]||"trip"} started with a single word?”`, vis:"Quick cuts: cards flip, hands hover", sfx:"Pop + warm bed"},
    {t:"0:04–0:12", ho:"Setup", vo:`“${title}. ${rounds} rounds, ${state.players} players, ${state.minutes} minutes.”`, vis:"Circle forms, host places starter card", sfx:"Light percussion"},
    {t:"0:12–0:22", ho:"Play", vo:`“One line, pass it on — ${rules[1].slice(0,58)}…”`, vis:"Over-shoulder, laughter, gesture mirror", sfx:"Claps on hesitation"},
    {t:"0:22–0:28", ho:"Twist", vo:fam.twist, vis:"Twist card spun, everyone reacts", sfx:"Record scratch → giggle"},
    {t:"0:28–0:35", ho:"Close", vo: scoring, vis:"Group holds postcard wall, freeze frame on title", sfx:"Resolve chord, paper rustle"}
  ];
  return {title, setup:fam.setup+" "+setupExtra, rounds, rules, scoring, variations, imagePrompts, scenes, hash:h};
}

function drawCover(canvas, title, vibe){
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w=440,h=300; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width="100%"; canvas.style.height="100%";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const g=ctx.createLinearGradient(0,0,w,0);
  if(vibe==="cozy"){ g.addColorStop(0,"#fff1d6"); g.addColorStop(1,"#ffe1c7"); }
  else if(vibe==="competitive"){ g.addColorStop(0,"#ffd9d0"); g.addColorStop(1,"#ffede6"); }
  else { g.addColorStop(0,"#d6fff4"); g.addColorStop(1,"#fff3a8"); }
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // abstract shapes
  ctx.fillStyle="rgba(19,20,16,.08)";
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(40+i*80, 220 - i*12, 60+ i*6, 22, 0,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle="#131410"; ctx.font="800 22px Georgia, serif"; ctx.fillText(title.split(":")[0]||title, 18, 34);
  ctx.font="400 13px ui-sans-system, sans-serif"; ctx.fillStyle="#3a3d36"; ctx.fillText(title.split(":")[1]?.trim()||"", 18, 54);
  // cards fanned
  for(let i=0;i<4;i++){
    ctx.save(); ctx.translate( 70+i*62, 110); ctx.rotate((-12+i*8)*Math.PI/180);
    ctx.fillStyle="#fff"; ctx.strokeStyle="#e6e6df"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(-42,-58,84,116,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#0f766e"; ctx.font="700 9px ui-sans-system, sans-serif"; ctx.fillText(["TRAVEL","LAUGH","PLAY","ISLAND"][i%4], -26, -32);
    ctx.fillStyle="#131410"; ctx.font="600 11px Georgia, serif"; ctx.fillText("Card "+(i+1), -22, 0);
    ctx.restore();
  }
  ctx.fillStyle="rgba(230,62,17,.9)"; ctx.beginPath(); ctx.roundRect(w-92, h-34, 80, 22, 999); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="700 10px ui-sans-system, sans-serif"; ctx.fillText("CGAMES", w-76, h-20);
}

function drawPromptPreview(canvas, seed, idx){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1; const w=400,h=264; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width="100%"; canvas.style.height="100%";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const palettes=[["#0f766e","#ffb627","#e63e11"],["#131410","#eceee9","#ff4d2e"],["#1a2a3a","#d6fff4","#ff6b35"]];
  const pal=palettes[idx%palettes.length];
  ctx.fillStyle=pal[1]||"#eceee9"; ctx.fillRect(0,0,w,h);
  const rnd=seeded(seed+idx*999);
  for(let i=0;i<18;i++){
    const x=rnd()*w, y=rnd()*h, r= 10+rnd()*28;
    ctx.fillStyle= i%3===0?pal[0]: i%3===1?pal[2]:"#ffffff";
    ctx.globalAlpha=.18 + rnd()*.22;
    ctx.beginPath(); if(idx%2===0) ctx.arc(x,y,r,0,Math.PI*2); else ctx.roundRect(x-r,y-r,r*2,r*2, r*.3);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#131410"; ctx.font="800 11px ui-sans-system, sans-serif"; ctx.fillText(`PROMPT ${idx+1}`,12,18);
}

function render(){
  const out=el("out");
  const g=state.current;
  if(!g){ out.innerHTML=`<div class="empty">Hit <b>Generate</b> to create your first game. Every run is seeded and saved locally.</div>`; return; }
  if(state.tab==="script"){
    out.innerHTML=`
      <div class="hero">
        <div class="hero-top">
          <div style="flex:1;min-width:240px">
            <span class="hero-badge">${FAMILIES[state.family].title[0].toUpperCase()} · ${state.vibe.toUpperCase()}</span>
            <h3>${g.title.replace(":","<i>:")}</i></h3>
            <div class="meta"><span>${state.players} players</span><span>${state.minutes} min</span><span>${state.age}</span><span>${[...state.kws].join(" · ")||"no keywords"}</span><span>energy ${state.energy}/5</span></div>
          </div>
          <div class="hero-art"><canvas id="cover"></canvas></div>
        </div>
        <div class="sections">
          <div class="card"><h4>Setup</h4><p>${g.setup}</p><p style="margin-top:8px;color:var(--muted)">${g.rounds} rounds · ${VIBES[state.vibe].ruleTone} · ${AGES[state.age]}.</p></div>
          <div class="card"><h4>Win / Close</h4><p>${g.scoring}</p></div>
          <div class="card" style="grid-column:1/-1"><h4>Rules — read aloud</h4><ol>${g.rules.map(r=>`<li>${r}</li>`).join("")}</ol>
            <div class="variations">${g.variations.map(v=>`<div class="var"><b>${v.name}</b><div>${v.text}</div></div>`).join("")}</div>
          </div>
        </div>
      </div>`;
    requestAnimationFrame(()=> drawCover(document.getElementById("cover"), g.title, state.vibe));
  } else if(state.tab==="images"){
    out.innerHTML=`<div class="img-grid">${g.imagePrompts.map((p,i)=>`
      <div class="prompt">
        <div class="prompt-visual"><canvas data-prompt="${i}"></canvas></div>
        <div class="prompt-body">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><kbd>${p.tag}</kbd><span style="font-size:11px;color:var(--muted)">${p.ar}</span></div>
          <p>${p.prompt}</p>
          <div class="tags"><span>${state.family}</span><span>${state.vibe}</span><span>${[...state.kws].join(", ")||"neutral"}</span></div>
          <button class="btn small" onclick="navigator.clipboard.writeText(${JSON.stringify(p.prompt)}).then(()=>{this.textContent='Copied ✓'; setTimeout(()=>this.textContent='Copy',1200)})">Copy</button>
        </div>
      </div>`).join("")}</div>
      <p style="font-size:11px;color:var(--muted);margin-top:10px">Paste any prompt into Midjourney / DALL·E / Firefly. Add <code>--style raw</code> for photos.</p>`;
    requestAnimationFrame(()=>{
      document.querySelectorAll("[data-prompt]").forEach(c=>{
        drawPromptPreview(c, g.hash, parseInt(c.getAttribute("data-prompt"),10));
      });
    });
  } else if(state.tab==="video"){
    out.innerHTML=`<div class="timeline">${g.scenes.map(s=>`
      <div class="scene"><div class="scene-time">${s.t}</div>
        <div class="scene-card"><b>${s.ho}</b><p>${s.vo}</p><p style="color:var(--muted)">${s.vis}</p><div class="line">VO: ${s.vo} · SFX: ${s.sfx}</div></div>
      </div>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <span style="font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:999px;background:#fff">Music: lo-fi 92bpm, warm chords</span>
        <span style="font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:999px;background:#fff">Export: 1080×1920 · 30fps</span>
        <span style="font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:999px;background:#fff">VO: calm, close-mic</span>
      </div>`;
  } else {
    out.innerHTML=`
      <div style="border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff">
        <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px">
          <b style="font-size:13px">Printable — cut on dotted lines</b><button class="btn small" onclick="window.print()">Print / Save PDF</button>
        </div>
        <div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
          ${[0,1,2,3].map(i=>`<div style="border:1px dashed #b8b8ad;border-radius:12px;padding:14px;min-height:140px;background:#fbfbfa"><div style="font-size:10px;letter-spacing:.08em;font-weight:800;color:var(--muted)">CARD ${i+1} — ${["STARTER","TWIST","BONUS","CLOSE"][i]}</div><div style="font-family:Georgia,serif;font-weight:800;margin-top:6px">${[g.rules[0], g.rules[3], "If you laugh, keep the card.", g.scoring][i]}</div><div style="margin-top:8px;font-size:12px;color:var(--muted)">${[...state.kws].join(" · ")||"CGAMES"}</div></div>`).join("")}
        </div>
      </div>`;
  }
}

function pushHistory(g){
  const snap={family:state.family,players:state.players,minutes:state.minutes,vibe:state.vibe,energy:state.energy,age:state.age,kws:[...state.kws]};
  state.history.unshift({title:g.title, at: new Date().toLocaleTimeString(), hash:g.hash, snap});
  if(state.history.length>12) state.history.pop();
  try{ localStorage.setItem("cg_history", JSON.stringify(state.history)); }catch(e){}
  renderHistory();
}
function renderHistory(){
  const h=el("history"); h.innerHTML="";
  if(!state.history.length){ h.innerHTML=`<span style="font-size:11px;color:var(--muted)">No history yet</span>`; return; }
  state.history.forEach((it,idx)=>{
    const b=document.createElement("button");
    b.textContent= it.title.slice(0,28);
    b.title=it.title;
    b.onclick=()=>{
      // restore snap
      const s=it.snap;
      state.family=s.family; state.players=s.players; state.minutes=s.minutes; state.vibe=s.vibe; state.energy=s.energy; state.age=s.age; state.kws=new Set(s.kws);
      el("family").value=state.family; el("players").value=state.players; el("minutes").value=state.minutes; el("age").value=state.age; el("energy").value=state.energy;
      el("playersVal").textContent=state.players;
      el("energyVal").textContent=["1 · zen","2 · steady","3 · balanced","4 · high","5 · chaos"][state.energy-1];
      document.querySelectorAll("#vibe button").forEach(x=> x.classList.toggle("active", x.dataset.v===state.vibe));
      renderKeywords();
      state.current=buildGame(); state.current.title=it.title; state.current.hash=it.hash;
      render();
    };
    h.appendChild(b);
  });
}

// bindings
el("players").addEventListener("input", e=>{ state.players=+e.target.value; el("playersVal").textContent=state.players; });
el("energy").addEventListener("input", e=>{ state.energy=+e.target.value; el("energyVal").textContent=["1 · zen","2 · steady","3 · balanced","4 · high","5 · chaos"][state.energy-1]; });
document.querySelectorAll("#vibe button").forEach(b=> b.addEventListener("click", ()=>{
  state.vibe=b.dataset.v; document.querySelectorAll("#vibe button").forEach(x=>x.classList.toggle("active", x.dataset.v===state.vibe));
}));
el("family").addEventListener("change", e=> state.family=e.target.value);
el("minutes").addEventListener("change", e=> state.minutes=e.target.value);
el("age").addEventListener("change", e=> state.age=e.target.value);
el("customKw").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const v=e.target.value.trim().toLowerCase(); if(!v) return;
    if(state.kws.size>=3) state.kws.delete([...state.kws][0]); state.kws.add(v); e.target.value=""; renderKeywords(); }
});

el("generate").addEventListener("click", ()=>{
  const g=buildGame(); state.current=g; pushHistory(g); render();
});
el("btnRandom").addEventListener("click", ()=>{
  const fams=Object.keys(FAMILIES); state.family=fams[Math.floor(Math.random()*fams.length)];
  state.vibe=["cozy","competitive","silly"][Math.floor(Math.random()*3)];
  state.players= 2+Math.floor(Math.random()*12); state.energy=1+Math.floor(Math.random()*5);
  state.minutes=["5","10","20","40"][Math.floor(Math.random()*4)];
  const shuffled=[...KEYWORDS].sort(()=>Math.random()-.5); state.kws=new Set(shuffled.slice(0,2+Math.floor(Math.random()*2)));
  el("family").value=state.family; el("players").value=state.players; el("minutes").value=state.minutes; el("energy").value=state.energy; el("age").value=state.age;
  el("playersVal").textContent=state.players; el("energyVal").textContent=["1 · zen","2 · steady","3 · balanced","4 · high","5 · chaos"][state.energy-1];
  document.querySelectorAll("#vibe button").forEach(x=>x.classList.toggle("active", x.dataset.v===state.vibe));
  renderKeywords();
  const g=buildGame(); state.current=g; pushHistory(g); render();
});
document.querySelectorAll(".tabs button").forEach(b=> b.addEventListener("click", ()=>{
  state.tab=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active", x.dataset.tab===state.tab)); render();
}));
el("copyAll").addEventListener("click", ()=>{
  if(!state.current) return;
  let txt="";
  if(state.tab==="script") txt=`${state.current.title}\nSetup: ${state.current.setup}\nRounds: ${state.current.rounds}\nRules:\n- ${state.current.rules.join("\n- ")}\nClose: ${state.current.scoring}`;
  else if(state.tab==="images") txt=state.current.imagePrompts.map(p=>`[${p.tag} ${p.ar}] ${p.prompt}`).join("\n\n");
  else if(state.tab==="video") txt=state.current.scenes.map(s=>`${s.t} ${s.ho}: ${s.vo} | ${s.vis} (${s.sfx})`).join("\n");
  else txt=document.getElementById("out").innerText;
  navigator.clipboard.writeText(txt).then(()=>{ el("copyAll").textContent="Copied ✓"; setTimeout(()=> el("copyAll").textContent="Copy current",1200); });
});
el("copyPrompts").addEventListener("click", ()=>{
  if(!state.current) return;
  const txt=state.current.imagePrompts.map(p=>p.prompt).join("\n\n");
  navigator.clipboard.writeText(txt).then(()=>{ el("copyPrompts").textContent="Copied ✓"; setTimeout(()=> el("copyPrompts").textContent="Copy all prompts",1200); });
});
el("btnExport").addEventListener("click", ()=>{
  if(!state.current) return;
  const blob=new Blob([JSON.stringify({config:{family:state.family,players:state.players,minutes:state.minutes,vibe:state.vibe,energy:state.energy,age:state.age,kws:[...state.kws]}, game:state.current},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`cgames-${Date.now()}.json`; a.click();
});
el("btnClear").addEventListener("click", ()=>{ localStorage.removeItem("cg_history"); state.history=[]; renderHistory(); });

// init
renderHistory();
state.current=buildGame(); pushHistory(state.current); render();

// expose for harness
window.__cg={buildGame, state, render};
</script>
</body>
