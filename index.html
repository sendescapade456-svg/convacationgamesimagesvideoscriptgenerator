function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

  ];

function drawCover(canvas,title,vibe){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1; const w=440,h=280; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width="100%"; canvas.style.height="100%";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const g=ctx.createLinearGradient(0,0,w,0);
  if(vibe==="cozy"){ g.addColorStop(0,"#fff1d6"); g.addColorStop(1,"#ffe1c7");}
  else if(vibe==="competitive"){ g.addColorStop(0,"#ffd9d0"); g.addColorStop(1,"#ffede6");}
  else { g.addColorStop(0,"#d6fff4"); g.addColorStop(1,"#fff3a8");}
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(19,20,16,.07)"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(40+i*80,210-i*10,60+i*6,22,0,0,Math.PI*2); ctx.fill();}
  ctx.fillStyle="#0d0f0e"; ctx.font="800 17px Georgia, serif"; ctx.fillText((title.split(":")[0]||title).slice(0,26),16,30);
  ctx.fillStyle="#3a3d36"; ctx.font="400 12px ui-sans-system, sans-serif"; ctx.fillText((title.split(":")[1]?.trim()||"").slice(0,32),16,50);
  for(let i=0;i<4;i++){ ctx.save(); ctx.translate(68+i*62,108); ctx.rotate((-12+i*8)*Math.PI/180); ctx.fillStyle="#fff"; ctx.strokeStyle="#e7e3da"; ctx.lineWidth=1.2; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(-42,-58,84,116,10); else ctx.rect(-42,-58,84,116); ctx.fill(); ctx.stroke(); ctx.fillStyle="#0f7a6e"; ctx.font="700 8px ui-sans-system, sans-serif"; ctx.fillText(["TRAVEL","LAUGH","PLAY","ISLAND"][i%4],-26,-30); ctx.fillStyle="#0d0f0e"; ctx.font="600 10px Georgia, serif"; ctx.fillText("Card "+(i+1),-20,2); ctx.restore();}
  ctx.fillStyle="rgba(232,67,14,.92)"; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(w-92,h-30,80,20,999); else ctx.rect(w-92,h-30,80,20); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="700 10px ui-sans-system, sans-serif"; ctx.fillText("CGAMES",w-74,h-17);
}
function drawPromptPreview(canvas,seed,idx){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1; const w=400,h=264; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width="100%"; canvas.style.height="100%";
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const palettes=[["#0f7a6e","#f5b70a","#e8430e"],["#0d0f0e","#f6f3ee","#ff4d2e"],["#1a2a3a","#d6fff4","#ff6b35"]];
  const pal=palettes[idx%palettes.length];
  ctx.fillStyle=pal[1]; ctx.fillRect(0,0,w,h);
  const rnd=seeded(seed+idx*999);
  for(let i=0;i<18;i++){ const x=rnd()*w,y=rnd()*h,r=10+rnd()*28; ctx.fillStyle=i%3===0?pal[0]:i%3===1?pal[2]:"#fff"; ctx.globalAlpha=.18+rnd()*.22; ctx.beginPath(); if(idx%2===0) ctx.arc(x,y,r,0,Math.PI*2); else { if(ctx.roundRect) ctx.roundRect(x-r,y-r,r*2,r*2,r*.3); else ctx.rect(x-r,y-r,r*2,r*2);} ctx.fill(); } ctx.globalAlpha=1;
  ctx.fillStyle="#0d0f0e"; ctx.font="800 11px ui-sans-system, sans-serif"; ctx.fillText("PROMPT "+(idx+1),12,18);
}

const winDefs={
  studio:{title:"CG Studio — Generator", w:720, h:520, x:96, y:14},
  gallery:{title:"Gallery — Images · Video · Scripts", w:740, h:500, x:130, y:44},

};
let zCounter=10;
const wins={};
function createWindow(id){
  if(wins[id]){ focusWin(id); return wins[id]; }
  const def=winDefs[id];
  const wrap=document.getElementById("winLayer");
  const el=document.createElement("div");
  el.className="win focused";
  el.id="win-"+id;
  el.style.left=def.x+"px"; el.style.top=def.y+"px";
  el.style.width=def.w+"px"; el.style.height=def.h+"px";
  el.style.zIndex=++zCounter;
  el.innerHTML=`<div class="titlebar" data-drag="${id}">
    <div class="traffic"><b class="c" data-close="${id}"></b><b class="m" data-min="${id}"></b><b class="z" data-max="${id}"></b></div>
    <div class="title"> ${id==="studio"?"◈":id==="gallery"?"▦":id==="chat"?"✦":id==="nanonets"?"⬢":id==="files"?"🗂":"›_"} ${def.title} <span class="badge" id="badge-${id}" style="display:none"></span></div>
    <div class="titlebar-actions"><button class="icon-btn" data-close="${id}">✕</button></div>
  </div><div class="win-body" id="body-${id}"></div><div class="resize" data-resize="${id}"></div>`;
  wrap.appendChild(el);
  wins[id]=el;
  el.addEventListener("mousedown",()=> focusWin(id));
  // drag
  const bar=el.querySelector("[data-drag]");
  let sx=0,sy=0, ox=0, oy=0, dragging=false;
  bar.addEventListener("mousedown", e=>{
    if(e.target.closest("[data-close],[data-min],[data-max]")) return;
    dragging=true; sx=e.clientX; sy=e.clientY; ox=parseInt(el.style.left); oy=parseInt(el.style.top);
    focusWin(id);
    const mm=(ev)=>{ if(!dragging) return; el.style.left=(ox+ev.clientX-sx)+"px"; el.style.top=Math.max(0, oy+ev.clientY-sy)+"px"; };
    const mu=()=>{ dragging=false; document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); };
    document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
  });
  // resize
  const rez=el.querySelector("[data-resize]");
  rez.addEventListener("mousedown", e=>{
    e.preventDefault(); let sw=el.offsetWidth, sh=el.offsetHeight, sx=e.clientX, sy=e.clientY;
    const mm=(ev)=>{ el.style.width=Math.max(340, sw+ev.clientX-sx)+"px"; el.style.height=Math.max(240, sh+ev.clientY-sy)+"px"; };
    const mu=()=>{ document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); };
    document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
  });
  el.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click",()=> closeWin(id)));
  el.querySelectorAll("[data-min]").forEach(b=> b.addEventListener("click",()=> minimizeWin(id)));
  el.querySelectorAll("[data-max]").forEach(b=> b.addEventListener("click",()=> maximizeWin(id)));
  el.querySelector(".win-body").addEventListener("mousedown",()=> focusWin(id));
  renderWindowBody(id);
  updateDock();
  return el;
}
function focusWin(id){
  Object.values(wins).forEach(w=> w.classList.remove("focused"));
  if(wins[id]){ wins[id].classList.remove("minimized"); wins[id].style.zIndex=++zCounter; wins[id].classList.add("focused"); }
  updateDock();
}
function closeWin(id){
  const el=wins[id]; if(!el) return; el.remove(); delete wins[id]; updateDock();
}
function minimizeWin(id){
  if(!wins[id]) return; wins[id].classList.add("minimized"); updateDock();
}
function maximizeWin(id){
  const el=wins[id]; if(!el) return;
  if(el.dataset.maxed==="1"){ el.style.left=el.dataset.ol; el.style.top=el.dataset.ot; el.style.width=el.dataset.ow; el.style.height=el.dataset.oh; el.dataset.maxed="0"; }
  else { el.dataset.ol=el.style.left; el.dataset.ot=el.style.top; el.dataset.ow=el.style.width; el.dataset.oh=el.style.height; el.style.left="8px"; el.style.top="4px"; el.style.width="calc(100% - 16px)"; el.style.height="calc(100% - 8px)"; el.dataset.maxed="1"; }
}
function openWin(id){ createWindow(id); }
function updateDock(){
  document.querySelectorAll(".dock button[data-win]").forEach(b=>{
    const id=b.dataset.win;
    b.classList.toggle("active", !!wins[id] && !wins[id].classList.contains("minimized"));
    let dot=b.querySelector("i.dot");
    if(wins[id]){ if(!dot){ dot=document.createElement("i"); dot.className="dot"; b.appendChild(dot);} }
    else { if(dot) dot.remove(); }
  });
}

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function renderWindowBody(id){
  const c=document.getElementById("body-"+id);
  if(!c) return;
  if(id==="studio") c.innerHTML=renderStudio();
  else if(id==="gallery") c.innerHTML=renderGallery();
  else if(id==="chat") c.innerHTML=renderChat();
  else if(id==="nanonets") c.innerHTML=renderNanonets();
  else if(id==="files") c.innerHTML=renderFiles();
  else if(id==="terminal") c.innerHTML=renderTerminal();
  // hook events after render
  if(id==="studio") hookStudio();
  if(id==="gallery") hookGallery();
  if(id==="chat") hookChat();
  if(id==="nanonets") hookNanonets();
  if(id==="files") hookFiles();
  if(id==="terminal") hookTerminal();
  // paint canvases
  requestAnimationFrame(()=>{
    if(state.current){
      const cv=c.querySelector("#cover");
      if(cv) drawCover(cv, state.current.title, state.current.meta.vibe);
      c.querySelectorAll("canvas[data-prompt]").forEach(cc=>{
        const idx=parseInt(cc.getAttribute("data-prompt"),10);
        const h=loadHistory();
        // gallery case uses ei-pi, studio uses simple idx
        if(cc.getAttribute("data-prompt").includes("-")){
          const [ei,pi]=cc.getAttribute("data-prompt").split("-").map(Number);
          if(h[ei]) drawPromptPreview(cc, h[ei].hash, pi);
        } else {
          drawPromptPreview(cc, state.current.hash, idx);
        }
      });
      c.querySelectorAll("canvas[data-my]").forEach(cc=>{
        const h=Number(cc.getAttribute("data-my"));
        drawPromptPreview(cc, h, 0);
      });
    }
  });
}

  body.querySelector("#s-energy").addEventListener("input", e=>{ state.energy=+e.target.value; body.querySelector("#s-energyVal").textContent=["1 · zen","2 · steady","3 · balanced","4 · high","5 · chaos"][state.energy-1]; });
  body.querySelectorAll("#s-vibe button").forEach(b=> b.addEventListener("click", ()=>{ state.vibe=b.dataset.v; body.querySelectorAll("#s-vibe button").forEach(x=> x.classList.toggle("on", x.dataset.v===state.vibe)); }));
  body.querySelector("#s-family").addEventListener("change", e=> state.family=e.target.value);
  body.querySelector("#s-minutes").addEventListener("change", e=> state.minutes=e.target.value);
  body.querySelector("#s-age").addEventListener("change", e=> state.age=e.target.value);
  body.querySelector("#s-customKw").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=e.target.value.trim().toLowerCase(); if(!v) return; if(state.kws.size>=3) state.kws.delete([...state.kws][0]); state.kws.add(v); e.target.value=""; renderKws(); }});
  body.querySelector("#s-generate").addEventListener("click", doGenerate);
  body.querySelector("#s-shuffle").addEventListener("click", doShuffle);
  body.querySelector("#s-toGallery").addEventListener("click", ()=> openWin("gallery"));
  body.querySelector("#s-toChat").addEventListener("click", ()=>{ openWin("chat"); setTimeout(()=>{ const inp=document.getElementById("chatInput"); if(inp) inp.focus(); },100); });
  body.querySelector("#s-export").addEventListener("click", ()=>{
    if(!state.current) return;
    const blob=new Blob([JSON.stringify({config:{family:state.family,players:state.players,minutes:state.minutes,vibe:state.vibe,energy:state.energy,age:state.age,kws:[...state.kws]}, game:state.current},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`cgames-${Date.now()}.json`; a.click();
  });
  body.querySelector("#s-clear").addEventListener("click", ()=>{ if(confirm("Clear history?")){ localStorage.removeItem("cg_history"); refreshAll(); }});
}

function refreshAll(){
  if(wins.studio) renderWindowBody("studio");
  if(wins.gallery) renderWindowBody("gallery");
  if(wins.files) renderWindowBody("files");
  if(wins.terminal) renderWindowBody("terminal");
  if(wins.nanonets) renderWindowBody("nanonets");
  updateBadges();
}

function updateBadges(){
  const h=loadHistory();
  ["studio","gallery","files"].forEach(id=>{
    const b=document.getElementById("badge-"+id);
    if(b) { if(h.length){ b.textContent=h.length; b.style.display="inline-block"; } else b.style.display="none"; }
  });
  const cb=document.getElementById("badge-chat");
  if(cb){ cb.textContent="AI"; cb.style.display="inline-block"; }
}

function doGenerate(){
  const g=buildGame();
  const owner=getUser()||"guest";
  const h=loadHistory(); h.unshift({title:g.title, hash:g.hash, createdAt:g.createdAt, meta:g.meta, game:g, owner}); saveHistory(h);
  state.current=g;
  refreshAll();
  // push chat message if chat open
  if(wins.chat){
    addBotMessage(`Generated <b>${esc(g.title)}</b> — ${g.meta.players} players · ${g.meta.minutes} min · ${g.meta.vibe}.<br><span class='subtle'>4 image prompts + 5-scene video + script ready. Ask me to “show images” or “play video”.</span>`, g);
  }
}
function doShuffle(){
  const fams=Object.keys(FAMILIES); state.family=fams[Math.floor(Math.random()*fams.length)];
  state.vibe=["cozy","competitive","silly"][Math.floor(Math.random()*3)];
  state.players=2+Math.floor(Math.random()*12); state.energy=1+Math.floor(Math.random()*5);
  state.minutes=["5","10","20","40"][Math.floor(Math.random()*4)];
  const sh=[...KEYWORDS].sort(()=>Math.random()-.5); state.kws=new Set(sh.slice(0,2+Math.floor(Math.random()*2)));
  refreshAll();
  doGenerate();
}

  </div>`;

let chatHistory=[];
function hookChat(){
  const log=document.getElementById("chatLog");
  const inp=document.getElementById("chatInput");
  const send=document.getElementById("chatSend");
  if(!log||!inp) return;
  function renderLog(){
    log.innerHTML=chatHistory.map(m=>`<div class="bubble ${m.role}">${m.html}<div class="meta-line">${m.meta||""}</div></div>`).join("");
    log.scrollTop=log.scrollHeight;
  }
  if(chatHistory.length===0){
    chatHistory.push({role:"bot", html:`Hi — I'm <b>LiveChat AI</b> trained on the Nanonets CGAMES corpus.<br><span class="subtle">I generate Images, Videos and Scripts offline from the same model Studio uses.</span><br><br>Try:<br>• <code>generate competitive debate nostalgia 8 players</code><br>• <code>show images</code> / <code>show video</code> / <code>show script</code><br>• <code>shuffle</code> or <code>open gallery</code>`, meta:"nanonets-cgames-v1 • ready"});
    renderLog();
  } else renderLog();
  document.querySelectorAll(".quick[data-q]").forEach(b=>{
    b.onclick=()=>{ inp.value=b.dataset.q; handleChat(inp.value); };
  });
  function handleChat(text){
    const q=text.trim(); if(!q) return;
    chatHistory.push({role:"user", html:esc(q), meta:"you"});
    renderLog(); inp.value="";
    setTimeout(()=>{ botReply(q); renderLog(); }, 260);
  }
  function botReply(q){
    const low=q.toLowerCase();
    // quick commands
    if(low.includes("show image") || low.includes("image prompt")){
      const g=state.current || loadHistory()[0]?.game;
      if(!g) { chatHistory.push({role:"bot", html:`No generation yet — hit <b>Generate</b> in Studio first.`, meta:"tip"}); return; }
      const html=g.imagePrompts.map(p=>`<pre>[${esc(p.tag)} ${esc(p.ar||"")}] ${esc(p.prompt)}</pre>`).join("") + `<div style="margin-top:8px"><button class="btn-sm" onclick="openWin('gallery'); state.tab='images'; renderWindowBody('gallery')">Open Images</button></div>`;
      chatHistory.push({role:"bot", html: html, meta:"nanonets • image head • "+g.hash.toString(16).slice(0,6)}); return;
    }
    if(low.includes("video") || low.includes("storyboard")){
      const g=state.current || loadHistory()[0]?.game;
      if(!g) { chatHistory.push({role:"bot", html:`Generate first — then I can show the 5-scene timeline.`, meta:"tip"}); return; }
      const html=g.scenes.map(s=>`<div style="border-left:2px solid #e7e3da;padding:4px 8px;margin:4px 0;background:#fdfcf9;border-radius:6px"><b>${esc(s.t)} ${esc(s.ho)}</b><br>${esc(s.vo)}<br><span class="subtle">${esc(s.vis)} · ${esc(s.sfx)}</span></div>`).join("") + `<div style="margin-top:8px"><button class="btn-sm" onclick="openWin('gallery'); state.tab='videos'; renderWindowBody('gallery')">Open Videos</button></div>`;
      chatHistory.push({role:"bot", html: html, meta:"nanonets • video head • 5 scenes"}); return;
    }
    if(low.includes("script") || low.includes("print")){
      const g=state.current || loadHistory()[0]?.game;
      if(!g) { chatHistory.push({role:"bot", html:`No script yet — generate a game and I'll format it.`, meta:"tip"}); return; }
      const html=`<b>${esc(g.title)}</b><br><span class="subtle">Setup:</span> ${esc(g.setup)}<br><ol style="margin:6px 0 0;padding-left:18px">${g.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ol><p style="margin:6px 0 0"><b>Close:</b> ${esc(g.scoring)}</p><div style="margin-top:8px"><button class="btn-sm" onclick="openWin('gallery'); state.tab='scripts'; renderWindowBody('gallery')">Open Scripts</button></div>`;
      chatHistory.push({role:"bot", html: html, meta:"nanonets • script head"}); return;
    }
    if(low.includes("shuffle") || low.includes("surprise")){
      doShuffle();
      chatHistory.push({role:"bot", html:`Shuffled and generated <b>${esc(state.current.title)}</b> — check Studio for the preview.`, meta:"nanonets • sampled"}); return;
    }
    if(low.includes("open gallery") || low.includes("gallery")){ openWin("gallery"); chatHistory.push({role:"bot", html:`Opened Gallery — Images, Photos, Videos, Scripts and My Gallery are inside.`, meta:"window"}); return; }
    if(low.includes("clear")){ localStorage.removeItem("cg_history"); refreshAll(); chatHistory.push({role:"bot", html:`Cleared local history.`, meta:"storage"}); return; }
    // generation intent: parse keywords from message
    let triggered=false;
    const vibes=["cozy","competitive","silly"];
    const fams=Object.keys(FAMILIES);
    for(const v of vibes) if(low.includes(v)) { state.vibe=v; triggered=true; }
    for(const f of fams) if(low.includes(f)) { state.family=f; triggered=true; }
    // numbers
    const mPlayers=low.match(/(\d+)\s*player/);
    if(mPlayers){ state.players=Math.min(20,Math.max(2, parseInt(mPlayers[1],10))); triggered=true; }
    const mMin=low.match(/(\d+)\s*min/);
    if(mMin && ["5","10","20","40"].includes(mMin[1])) { state.minutes=mMin[1]; triggered=true; }
    // keywords extraction: look for known keywords in message
    const foundKws=KEYWORDS.filter(k=> low.includes(k));
    if(foundKws.length){ state.kws=new Set(foundKws.slice(0,3)); triggered=true; }
    if(low.includes("generate") || triggered){
      doGenerate();
      chatHistory.push({role:"bot", html:`Done — <b>${esc(state.current.title)}</b><br><span class="subtle">${esc(state.current.setup)} · ${state.current.rounds} rounds</span><br><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn-sm primary" onclick="openWin('gallery')">View Gallery</button><button class="btn-sm" onclick="openWin('studio')">Open Studio</button></div>`, meta:"nanonets • image+video+script • #"+state.current.hash.toString(16).slice(0,5)});
      return;
    }
    // fallback: explain
    chatHistory.push({role:"bot", html:`I can generate from the Nanonets model that Studio uses — same weights for images, video and scripts.<br><br>Try: <code>generate cozy story beach 6 players 10 min</code> or use the quick buttons above.`, meta:"help"});
  }
  send.onclick=()=> handleChat(inp.value);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") handleChat(inp.value); });
  window.addBotMessage=(html, g)=>{
    chatHistory.push({role:"bot", html, meta: g? "nanonets • #"+g.hash.toString(16).slice(0,5) : ""});
    const l=document.getElementById("chatLog");
    if(l){ l.innerHTML=chatHistory.map(m=>`<div class="bubble ${m.role}">${m.html}<div class="meta-line">${m.meta||""}</div></div>`).join(""); l.scrollTop=l.scrollHeight; }
  };
}

        </div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${Object.entries(FAMILIES).map(([k,v])=>`<span style="font-size:11px;border:1px solid #e7e3da;background:#fff;padding:5px 8px;border-radius:999px"><b>${k}</b> · ${v.title[0]}</span>`).join("")}</div>
        <div style="margin-top:12px;border:1px dashed #d9d4c6;border-radius:9px;padding:10px;background:#fff">
          <div style="font-size:11px;font-weight:800">Keyword embedding (offline)</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${KEYWORDS.map(k=>`<span style="font-size:11px;background:#edeae1;border:1px solid #ddd8cc;padding:4px 8px;border-radius:999px">${k}</span>`).join("")}</div>
          <div class="mono" style="margin-top:8px;color:#6b6f68">LiveChat and Studio share the same latent: hash → seeded → template → prompts/scenes.</div>
        </div>
      </div>
      <div class="nano-card" style="margin-top:12px">
        <h4>Inference log</h4>
        <div class="mono" style="max-height:160px;overflow:auto;background:#0d0f0e;color:#d6fff4;padding:10px;border-radius:8px;line-height:1.6">
          ${h.slice(0,6).map(e=>`[${new Date(e.createdAt).toLocaleTimeString()}] ${e.meta.family}/${e.meta.vibe} hash=${e.hash.toString(16).slice(0,6)} kws=${e.meta.kws.join(",")} → 4 prompts + 5 scenes`).join("<br>") || "No inferences yet — generate in Studio or via LiveChat."}
        </div>
        <div style="display:flex;gap:6px;margin-top:8px"><button class="btn-sm" onclick="doGenerate(); renderWindowBody('nanonets')">Run inference</button><button class="btn-sm" onclick="openWin('chat')">Ask LiveChat</button></div>
      </div>
    </div>
    <div>
      <div class="nano-card">
        <h4>Heads — Image · Video · Script</h4>
        <div style="display:grid;gap:10px;margin-top:8px">
          <div style="border:1px solid #e7e3da;border-radius:9px;padding:10px"><b style="font-size:12px">🖼 Image head</b><p style="font-size:11px;color:#6b6f68;margin:4px 0 0">4 prompts per game: Poster 3:4 · Thumbnail 16:9 · Cards 1:1 · Scene 21:9. Paste into Midjourney / Firefly.</p><div class="bar"><i style="width:86%"></i></div><div class="mono" style="margin-top:6px">template: “Flat vector poster for … {title} {adj} {kws} --ar {ar}”</div></div>
          <div style="border:1px solid #e7e3da;border-radius:9px;padding:10px"><b style="font-size:12px">🎬 Video head</b><p style="font-size:11px;color:#6b6f68;margin:4px 0 0">5-scene timeline (Hook/Setup/Play/Twist/Close) — 35s total, lo-fi 92bpm bed.</p><div class="bar"><i style="width:74%"></i></div><div class="mono" style="margin-top:6px">scenes: 0:00 Hook · 0:04 Setup · 0:12 Play · 0:22 Twist · 0:28 Close</div></div>
          <div style="border:1px solid #e7e3da;border-radius:9px;padding:10px"><b style="font-size:12px">📜 Script head</b><p style="font-size:11px;color:#6b6f68;margin:4px 0 0">Rules + Setup + Scoring + 2 variations. Printable cards & Canva deck.</p><div class="bar"><i style="width:92%"></i></div><div class="mono" style="margin-top:6px">output: setup · rounds · rules[5] · scoring</div></div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:#6b6f68;line-height:1.5">All three heads are deterministic from the same hash — LiveChat calls the same <code>buildGame()</code> Studio uses. No API.</div>
      </div>
      <div class="nano-card" style="margin-top:12px">
        <h4>Dataset stats</h4>
        <div class="mono" style="font-size:11px;line-height:1.7">
          Total generations: ${total}<br>
          Images: ${total*4} prompts<br>
          Videos: ${total} timelines (5 scenes)<br>

function hookNanonets(){}

function renderFiles(){
  const h=loadHistory();
  if(!h.length) return `<div style="padding:40px;text-align:center;color:#6b6f68"><div style="font-size:28px">🗂</div><p style="font-size:12px">No files yet — generate in Studio or ask LiveChat to generate.<br><span class="subtle">Files are the same gallery, shown as desktop files.</span></p><button class="btn-sm primary" onclick="openWin('studio')">Open Studio</button></div>`;
  return `<div style="padding:10px 14px;border-bottom:1px solid #e7e3da;background:#fdfcf9;display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="subtle">${h.length} files · ${h.length*4} images · ${h.length} videos</span><button class="btn-sm" onclick="if(confirm('Clear all?')){ localStorage.removeItem('cg_history'); renderWindowBody('files'); refreshAll(); }">Clear all</button></div>
  <div class="files">
    ${h.map((e,idx)=>`<div class="file" onclick="openWin('gallery'); state.tab='images'; renderWindowBody('gallery')">
      <div class="thumb"><canvas data-my="${e.hash}" style="width:100%;height:100%"></canvas></div>
      <b>${esc(e.title.slice(0,22))}</b><span>#${e.hash.toString(16).slice(0,5)} · ${esc(e.meta.family)} · ${e.meta.kws[0]||""}</span>
    </div>`).join("")}
  </div>`;
}
function hookFiles(){}

function renderTerminal(){
  const cfg=state.current? `family=${state.current.meta.family} players=${state.current.meta.players} minutes=${state.current.meta.minutes} vibe=${state.current.meta.vibe} energy=${state.current.meta.energy} age=${state.current.meta.age} kws=${state.current.meta.kws.join(",")}` : "no generation yet";
  const json=state.current? JSON.stringify({config:{family:state.family,players:state.players,minutes:state.minutes,vibe:state.vibe,energy:state.energy,age:state.age,kws:[...state.kws]}, game:state.current},null,2).slice(0,1200) : '{"tip":"hit Generate in Studio"}';
  return `<div style="background:#0d0f0e;color:#d6ffe7;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;min-height:100%">
    <div style="color:#8af0c0">$ python cgames.py --family ${state.family} --players ${state.players} --minutes ${state.minutes} --vibe ${state.vibe} --energy ${state.energy} --age ${state.age} --keywords ${[...state.kws].join(" ")} --json --seed demo</div>
    <div style="color:#7a9a8e;margin-top:6px"># offline · deterministic · nanonets-cgames-v1</div>
    <div style="margin-top:8px;color:#c8d5d0">${esc(cfg)}</div>
    <pre style="margin-top:10px;background:#111614;border:1px solid #1e2a27;padding:10px;border-radius:8px;overflow:auto;max-height:220px;color:#b9f5de;white-space:pre-wrap">${esc(json)}</pre>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn-sm primary" onclick="doGenerate(); renderWindowBody('terminal')">Run again</button><button class="btn-sm" style="background:#1e2a27;color:#d6ffe7;border-color:#2a3a32" onclick="navigator.clipboard.writeText(document.querySelector('#body-terminal pre').textContent)">Copy JSON</button><a class="btn-sm" href="cgames.html" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center;background:#fff;color:#0d0f0e">Open cgames.html ↗</a></div>
    <div style="margin-top:10px;color:#6b8a7e;font-size:11px">Tip: this terminal mirrors Studio. Ask LiveChat “generate …” — it runs the same buildGame() locally.</div>
  </div>`;
}
function hookTerminal(){}

// ===== dock & desktop bindings =====
document.querySelectorAll(".desk-icon, .dock button[data-win]").forEach(b=>{
  b.addEventListener("click", ()=>{
    const id=b.dataset.win; if(!id) return;
    if(wins[id] && !wins[id].classList.contains("minimized")){ focusWin(id); }
    else if(wins[id] && wins[id].classList.contains("minimized")){ focusWin(id); }
    else { openWin(id); }
  });
});
document.getElementById("dockTrash").addEventListener("click", ()=>{
  if(confirm("Clear all local generations?")){ localStorage.removeItem("cg_history"); refreshAll(); }
});
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); document.getElementById("spotlight").classList.toggle("hidden"); document.getElementById("spotInput")?.focus(); }
  if(e.key==="Escape") document.getElementById("spotlight").classList.add("hidden");
});
document.getElementById("spotInput")?.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const v=e.target.value.trim().toLowerCase();
    if(!v) return;
    document.getElementById("spotlight").classList.add("hidden");
    if(v.includes("chat")||v.includes("live")) openWin("chat");
    else if(v.includes("gallery")||v.includes("image")||v.includes("video")||v.includes("script")) openWin("gallery");
    else if(v.includes("studio")||v.includes("generate")) openWin("studio");
    else if(v.includes("nano")||v.includes("train")) openWin("nanonets");
    else if(v.includes("file")) openWin("files");
    else if(v.includes("terminal")) openWin("terminal");
    else if(v.includes("generate")||v.includes("create")){ openWin("chat"); setTimeout(()=>{ const inp=document.getElementById("chatInput"); if(inp){ inp.value=v; inp.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter"})); } },200); }
    else { openWin("chat"); }
  }
});
document.querySelector("[data-action='spotlight']")?.addEventListener("click", ()=>{ document.getElementById("spotlight").classList.remove("hidden"); document.getElementById("spotInput")?.focus(); });

function tickClock(){ const el=document.getElementById("clock"); if(el) el.textContent=new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
setInterval(tickClock, 1000); tickClock();

// init: create default windows and seed generation
(function init(){
  const h=loadHistory();
  if(h.length){ state.current=h[0].game; }
  else { const g=buildGame(); const owner=getUser()||"guest"; const arr=loadHistory(); arr.unshift({title:g.title, hash:g.hash, createdAt:g.createdAt, meta:g.meta, game:g, owner}); saveHistory(arr); state.current=g; }
  updateMenubar();
  // open default desktop
  openWin("studio");
  openWin("gallery");
  openWin("chat");
  // defer others collapsed but accessible via dock
  updateBadges();
  // focus chat last so user sees LiveChat
  setTimeout(()=> focusWin("chat"), 120);
})();

// expose for debug
window.__cg={state, buildGame, doGenerate, doShuffle, openWin};
</script>
